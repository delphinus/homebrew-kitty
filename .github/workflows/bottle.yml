name: Bottle

on:
  pull_request:
    paths:
      - Formula/**
      - .github/workflows/bottle.yml
  push:
    branches:
      - main
    paths:
      - Formula/**
  workflow_dispatch:

permissions:
  contents: write
  # To report the result of a workflow_dispatch run as a commit status.
  statuses: write

concurrency:
  group: bottle-${{ github.ref }}
  cancel-in-progress: true

env:
  # NOTE: Publish (build the bottle, upload it and write it back) only from
  # main. upstream.yml runs this workflow by workflow_dispatch on the branch of
  # its PR, because a PR opened with GITHUB_TOKEN triggers no pull_request
  # workflow; that run must only build and test.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  # NOTE: The checks of a PR do not show a workflow_dispatch run, though it
  # runs on the head of the PR. A commit status shows there, so such a run on
  # a branch reports itself as one (the first and the last step).
  REPORT: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
  STATUS_CONTEXT: bottle (build and test)

jobs:
  bottle:
    # NOTE: macos-26 is the arm64 image. The bottle tag it produces is
    # arm64_tahoe, which is what both of my machines want.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Report the run as pending
        if: env.REPORT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description='Building from source and testing' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # NOTE: Homebrew/actions renamed its default branch to main and deleted
      # master, so @master stopped resolving.
      - uses: Homebrew/actions/setup-homebrew@main

      # NOTE: Do not symlink a checkout into Library/Taps. brew does not pick
      # such a tap up (`brew tap` does not list it), so let brew clone the tap
      # itself and move it to the revision under test.
      - name: Tap the revision under test
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          brew tap delphinus/kitty
          tap_dir="$(brew --repository delphinus/kitty)"
          echo "TAP_DIR=$tap_dir" >> "$GITHUB_ENV"
          git -C "$tap_dir" fetch origin "$SHA"
          git -C "$tap_dir" checkout --detach "$SHA"
          git -C "$tap_dir" log --oneline -1

      - name: Read the formula version
        id: formula
        run: |
          version="$(brew info --json=v2 delphinus/kitty/kitty |
            jq -r '.formulae[0].versions.stable')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=kitty-$version" >> "$GITHUB_OUTPUT"

      # NOTE: This is where a patch that no longer applies shows up, so it runs
      # on pull_request too. --build-bottle rather than --build-from-source:
      # `brew bottle` refuses a keg that was not built with it. It only skips
      # post_install, the keg is still linked, so `brew test` works either way.
      - name: Build from source
        run: brew install --build-bottle --verbose delphinus/kitty/kitty

      - name: Test
        run: brew test delphinus/kitty/kitty

      - name: Audit
        run: brew audit --strict --online delphinus/kitty/kitty || true

      - name: Build the bottle
        if: env.PUBLISH == 'true'
        run: |
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/${{ github.repository }}/releases/download/${{ steps.formula.outputs.tag }}" \
            delphinus/kitty/kitty
          # NOTE: brew writes `name--version...` but downloads `name-version...`
          # (Bottle::Filename#url_encode). Copy under the name brew will ask for
          # or the bottle 404s. Copy rather than move: the json still refers to
          # the original name and `--merge` runs after this.
          for f in kitty--*.bottle.tar.gz; do
            cp "$f" "${f/--/-}"
          done
          ls -la kitty-*

      - name: Upload the bottle to a release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.formula.outputs.tag }}'
          gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1 ||
            gh release create "$tag" --repo '${{ github.repository }}' \
              --title "$tag" --notes 'Bottles for kitty ${{ steps.formula.outputs.version }}.'
          # NOTE: kitty-[0-9]* so the `kitty--...` original is not uploaded too.
          gh release upload "$tag" --repo '${{ github.repository }}' --clobber \
            kitty-[0-9]*.bottle.tar.gz

      - name: Write the checksums back into the formula
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          brew bottle --merge --write --no-commit ./kitty--*.bottle.json
          cd "$TAP_DIR"
          git diff --stat
          if git diff --quiet; then
            echo 'formula unchanged, nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git commit -am 'kitty ${{ steps.formula.outputs.version }}: add arm64_tahoe bottle [skip ci]'
          git push origin HEAD:main

      - name: Report the result
        if: always() && env.REPORT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context="$STATUS_CONTEXT" \
            -f description="Build from source and test: $STATE" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
